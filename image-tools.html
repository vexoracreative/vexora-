<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEXORA Image Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#050816;color:white;
font-family:Arial,sans-serif;
padding:30px 15px;
}
header{text-align:center;margin-bottom:40px}
h1{font-size:38px;color:#00c8ff}
header p{color:#aaa;margin-top:10px}
.container{max-width:900px;margin:auto}
.tools{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
.card{
background:#101a30;
border:1px solid #174c75;
border-radius:16px;
padding:25px;
text-align:center;
}
.card h2{color:#00c8ff;margin-bottom:12px}
.card p{color:#bbb;line-height:1.5;margin-bottom:20px}
button{
background:#00bfff;color:#00101a;
border:0;padding:12px 20px;
border-radius:8px;font-weight:bold;
cursor:pointer;
}
button:hover{background:#65ddff}
input{max-width:100%;margin:15px 0}
#status{margin-top:25px;color:#00e5ff;text-align:center}
a{color:#00c8ff}
</style>
</head>
<body>
<header>
<h1>VEXORA TOOLS</h1>
<p>Simple. Smart. Free Image Tools.</p>
</header>

<div class="container">
<div class="tools">

<div class="card">
<h2>Image to PDF</h2>
<p>Convert your images into a PDF file.</p>
<input type="file" id="pdfImages" accept="image/*" multiple>
<button onclick="makePDF()">Convert to PDF</button>
</div>

<div class="card">
<h2>Image Compressor</h2>
<p>Reduce image file size easily.</p>
<input type="file" id="compressImage" accept="image/*">
  <label>Compression Quality: <span id="qualityValue">60</span>%</label>

<input
type="range"
id="qualitySlider"
min="10"
max="100"
value="60"
oninput="document.getElementById('qualityValue').innerText=this.value"
>

<img id="compressPreview"
style="display:none;width:100%;margin-top:15px;border-radius:10px;">

<p id="sizeInfo" style="margin:15px 0;color:#00e5ff;"></p>

<a id="downloadArea"
style="display:none;background:#00c8ff;color:#00101a;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;">
Download Image
  <label style="display:block;margin-top:15px;">
  Target Image Size:
</label>

<select id="targetKB" style="padding:10px;width:100%;margin:10px 0;">
  <option value="50">50 KB</option>
  <option value="100">100 KB</option>
  <option value="200">200 KB</option>
  <option value="500">500 KB</option>
  <option value="0">Original quality</option>
</select>

<label>Custom Size (KB):</label>
<input type="number" id="customKB" placeholder="Enter KB" min="1">
</a>
<button onclick="compress()">Compress Image</button>
</div>

<div class="card">
<h2>Image Resize</h2>
<p>Resize your image dimensions.</p>
<input type="file" id="resizeImage" accept="image/*">
<button onclick="resize()">Resize Image</button>
</div>

</div>
<p id="status">Welcome to VEXORA Tools 🚀</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
async function makePDF(){

const files=document.getElementById('pdfImages').files;

if(!files.length){
alert('Please select images first!');
return;
}

const {jsPDF}=window.jspdf;

const sizeOption=document.getElementById('pdfPageSize')?.value || 'a4';
const orientation=document.getElementById('pdfOrientation')?.value || 'portrait';

let pdf;

for(let i=0;i<files.length;i++){

const file=files[i];

const imageURL=URL.createObjectURL(file);

try{

const img=await new Promise((resolve,reject)=>{
const image=new Image();
image.onload=()=>resolve(image);
image.onerror=reject;
image.src=imageURL;
});

let pageWidth,pageHeight;

if(sizeOption==='original'){

pageWidth=img.width*25.4/96;
pageHeight=img.height*25.4/96;

}else{

pageWidth=orientation==='landscape'?297:210;
pageHeight=orientation==='landscape'?210:297;

}

if(!pdf){
pdf=new jsPDF({
orientation:orientation,
unit:'mm',
format:sizeOption==='original'?[pageWidth,pageHeight]:'a4'
});
}else{
pdf.addPage(
sizeOption==='original'?[pageWidth,pageHeight]:'a4',
orientation
);
}

const canvas=document.createElement('canvas');
canvas.width=img.width;
canvas.height=img.height;

const ctx=canvas.getContext('2d');
ctx.fillStyle='#ffffff';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);

const imageData=canvas.toDataURL('image/jpeg',0.92);

const margin=sizeOption==='original'?0:10;
const maxWidth=pageWidth-margin*2;
const maxHeight=pageHeight-margin*2;

const scale=Math.min(maxWidth/img.width,maxHeight/img.height);

const finalWidth=img.width*scale;
const finalHeight=img.height*scale;

pdf.addImage(
imageData,
'JPEG',
(pageWidth-finalWidth)/2,
(pageHeight-finalHeight)/2,
finalWidth,
finalHeight
);

}catch(error){

alert('Unable to process: '+file.name);
return;

}finally{
URL.revokeObjectURL(imageURL);
}

}

pdf.save('VEXORA-Images.pdf');

document.getElementById('status').innerText=
'Your PDF has been created successfully!';

}

async function compress(){

const file=document.getElementById('compressImage').files[0];

if(!file){
alert('Please select an image first!');
return;
}

const targetOption=Number(document.getElementById('targetKB').value);
const customValue=Number(document.getElementById('customKB').value);

const targetKB=customValue>0 ? customValue : targetOption;
const targetBytes=targetKB*1024;

const qualitySlider=Number(document.getElementById('qualitySlider').value)/100;

const img=new Image();
const imageURL=URL.createObjectURL(file);

img.onload=async()=>{

const canvas=document.createElement('canvas');
canvas.width=img.width;
canvas.height=img.height;

canvas.getContext('2d').drawImage(img,0,0);

const makeBlob=(quality)=>new Promise(resolve=>{
canvas.toBlob(resolve,'image/jpeg',quality);
});

let bestBlob=null;

if(targetKB===0){

bestBlob=await makeBlob(qualitySlider);

}else{

let low=0.05;
let high=0.95;

for(let i=0;i<10;i++){

const mid=(low+high)/2;
const blob=await makeBlob(mid);

if(!blob) continue;

if(blob.size<=targetBytes){
bestBlob=blob;
low=mid;
}else{
high=mid;
}

}

if(!bestBlob){
bestBlob=await makeBlob(0.05);
}
}

URL.revokeObjectURL(imageURL);

if(!bestBlob){
alert('Compression failed!');
return;
}

const originalSize=(file.size/1024).toFixed(2);
const newSize=(bestBlob.size/1024).toFixed(2);

document.getElementById('sizeInfo').innerText=
'Original: '+originalSize+' KB | Compressed: '+newSize+' KB';

const url=URL.createObjectURL(bestBlob);

document.getElementById('compressPreview').src=url;
document.getElementById('compressPreview').style.display='block';

const download=document.getElementById('downloadArea');
download.href=url;
download.download='VEXORA-compressed.jpg';
download.style.display='inline-block';

document.getElementById('status').innerText=
bestBlob.size<=targetBytes || targetKB===0
?'Compression successful!'
:'Target size could not be reached. Try a larger KB target.';

};

img.onerror=()=>{
URL.revokeObjectURL(imageURL);
alert('Unable to load this image!');
};

img.src=imageURL;

}
function resize(){
const file=document.getElementById('resizeImage').files[0];
if(!file){alert('Select an image first');return;}
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');
canvas.width=800;
canvas.height=Math.round(img.height*(800/img.width));
canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
const a=document.createElement('a');
a.href=canvas.toDataURL('image/jpeg',0.85);
a.download='VEXORA-resized.jpg';
a.click();
document.getElementById('status').innerText='Resized image downloaded!';
};
img.src=URL.createObjectURL(file);
}
</script>
</body>
</html>
